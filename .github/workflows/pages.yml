name: Publish docs site
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/download_count.py', '.github/workflows/pages.yml']
  schedule:
    - cron: '23 3 * * *' # refresh the download count once a day (03:23 UTC ≈ 11:23 Beijing)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Refresh the download count
        run: python3 scripts/download_count.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build the docs site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - uses: actions/deploy-pages@v4
        id: deployment
